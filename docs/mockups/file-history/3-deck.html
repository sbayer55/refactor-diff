<meta charset="utf-8">
<title>Version Deck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shared/theme.css">
<style>
/* Layout: a full-screen stage. Every version of the file is a card; the one you are reading is
   centered, older versions recede to the left and newer ones to the right. A thumbnail rail at
   the bottom is the whole history at a glance. Pinning a card makes it the A side of a comparison. */
.stage { flex: 1; min-height: 0; position: relative; perspective: 1600px; overflow: hidden; background: radial-gradient(ellipse at 50% 120%, color-mix(in oklab, var(--accent) 10%, transparent), transparent 60%), var(--bg); }
.card { position: absolute; left: 50%; top: 22px; bottom: 16px; width: min(760px, 68vw); margin-left: calc(min(760px, 68vw) / -2); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; transition: transform .55s cubic-bezier(.2,.8,.2,1), opacity .45s, filter .45s, width .45s, margin .45s; transform-style: preserve-3d; cursor: pointer; }
.card.front { cursor: default; z-index: 10; }
.card:not(.front) .code-pane { overflow: hidden; pointer-events: none; }
.card:not(.front):hover { filter: brightness(1.15); }
.card.pinned { left: 0; margin-left: 16px; width: calc(50% - 24px); transform: none !important; opacity: 1 !important; filter: none !important; cursor: default; z-index: 9; border-color: var(--accent); }
.card.front.vs-a { width: calc(50% - 24px); margin-left: 8px; }
.card-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--border); background: var(--panel-2); font-size: 12px; }
.card-head .sha { font-family: var(--mono); color: var(--accent); }
.card-head .msg { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-head .who { color: var(--muted); white-space: nowrap; font-size: 11.5px; }
.card-head .btn { display: none; } .card.front .card-head .btn, .card.pinned .card-head .btn { display: inline-flex; }
.card .code-pane { --row-h: 20px; }
.card .ab { position: absolute; top: -10px; left: 14px; font: 700 10px var(--mono); padding: 2px 7px; border-radius: 4px; z-index: 2; display: none; }
.card.pinned .ab { display: block; border: 1.5px solid var(--accent); color: var(--accent); background: var(--panel); }
.card.front.vs-a .ab { display: block; background: var(--accent); color: var(--accent-ink); }
.rail { flex: none; height: 118px; border-top: 1px solid var(--border); background: var(--panel); display: flex; align-items: stretch; gap: 10px; padding: 10px 14px; overflow-x: auto; }
.thumb { flex: none; width: 92px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; border-radius: 4px; padding: 4px; border: 1px solid transparent; transition: border-color .2s, background .2s; }
.thumb:hover { background: var(--panel-2); }
.thumb.cur { border-color: var(--accent); background: var(--panel-2); }
.thumb.pin { border-color: var(--accent); border-style: dashed; }
.thumb .mini { flex: 1; display: grid; grid-auto-rows: 1fr; gap: 1px; background: var(--bg); border-radius: 3px; padding: 3px; overflow: hidden; }
.thumb .mini i { display: block; height: 100%; min-height: 1px; border-radius: 1px; background: var(--heat); opacity: .9; }
.thumb .mini i.chg { background: var(--add-fg); }
.thumb .lbl { font: 10px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb .lbl b { color: var(--text); font-weight: 500; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 20; width: 36px; height: 56px; font-size: 18px; justify-content: center; padding: 0; opacity: .85; }
.nav.l { left: 10px; } .nav.r { right: 10px; }
.hudbar { position: absolute; left: 50%; transform: translateX(-50%); top: 0; z-index: 20; display: flex; gap: 8px; align-items: center; padding: 3px 10px; background: color-mix(in oklab, var(--panel) 85%, transparent); border: 1px solid var(--border); border-top: 0; border-radius: 0 0 6px 6px; font-size: 11px; color: var(--muted); white-space: nowrap; }
@media (max-width: 760px) { .card { width: 84vw; margin-left: -42vw; } .nav { display: none; } .card.pinned, .card.front.vs-a { width: calc(50% - 12px); } }
</style>

<div class="app">
  <div id="topbar"></div>
  <div class="stage" id="stage">
    <div class="hudbar"><span id="pos"></span> · <kbd>←</kbd><kbd>→</kbd> flip · <kbd>p</kbd> pin as A · <kbd>c</kbd> checkout · click a side card to bring it forward</div>
    <button class="btn nav l" id="navl" title="Older">‹</button>
    <button class="btn nav r" id="navr" title="Newer">›</button>
  </div>
  <div class="rail" id="rail"></div>
</div>

<script src="shared/history.js"></script>
<script>
(() => {
  const { commits, lines, stats, blame, diff, short, initials, fmtDate, rel, heat } = FH;
  FH.topbar(document.getElementById('topbar'), 'mockup 3 · deck');
  const $ = (id) => document.getElementById(id);
  const N = commits.length, stage = $('stage');
  let cur = N - 1, pinned = null;
  const cards = [], thumbs = [];

  commits.forEach((c, i) => {
    const s = i ? stats(i - 1, i) : { add: lines(0).length, del: 0 };
    const card = document.createElement('div'); card.className = 'card'; card.dataset.i = i;
    card.innerHTML = `<span class="ab"></span><div class="card-head"><span class="sha">${short(c.sha)}</span>${c.tag ? `<span class="chip ${c.tag}">${c.tag}</span>` : ''}${c.pr ? '<span class="chip pr">PR</span>' : ''}<span class="msg">${c.message}</span><span class="who"><span class="avatar">${initials(c.author)}</span> ${c.author} · ${fmtDate(c.date)} · <span class="stat-add">+${s.add}</span> <span class="stat-del">−${s.del}</span></span>
      <button class="btn pin" title="Pin as A for comparison">Pin as A</button><button class="btn primary co">Checkout</button></div><div class="code-pane"></div>`;
    const pane = card.querySelector('.code-pane'); FH.morph(pane, i, { instant: true });
    card.addEventListener('click', (e) => { if (e.target.closest('.btn')) return; if (!card.classList.contains('front') && !card.classList.contains('pinned')) go(i); });
    card.querySelector('.co').onclick = () => FH.checkoutMenu(null, i);
    card.querySelector('.pin').onclick = () => togglePin(i);
    stage.insertBefore(card, $('navl')); cards.push(card);

    const t = document.createElement('div'); t.className = 'thumb'; t.dataset.i = i;
    const bl = blame(i), changed = new Set(diff(Math.max(0, i - 1), i).filter(o => o.t === 'add').map(o => o.b));
    t.innerHTML = `<div class="mini">${lines(i).map((_, k) => `<i class="${changed.has(k) && i ? 'chg' : ''}" style="--heat:${heat(bl[k], i)}"></i>`).join('')}</div>
      <span class="lbl"><b>${short(c.sha)}</b> ${rel(c.date)}</span><span class="lbl">${c.message}</span>`;
    t.addEventListener('click', () => go(i));
    t.addEventListener('dblclick', () => togglePin(i));
    $('rail').appendChild(t); thumbs.push(t);
  });

  function layout() {
    cards.forEach((card, i) => {
      const d = i - cur;
      card.classList.toggle('front', i === cur);
      card.classList.toggle('pinned', i === pinned);
      card.classList.toggle('vs-a', i === cur && pinned !== null && pinned !== cur);
      if (i === pinned) return;
      const ad = Math.abs(d), sign = Math.sign(d);
      if (d === 0) { card.style.transform = 'translateZ(0)'; card.style.opacity = 1; card.style.filter = ''; card.style.zIndex = 10; return; }
      const x = sign * (pinned !== null ? 56 : 38) * (1 + Math.min(ad, 4) * 0.9) + sign * (pinned !== null && d < 0 ? -9999 : 0);
      card.style.transform = `translateX(${sign * (26 + Math.min(ad, 5) * 9)}%) translateZ(${-120 * Math.min(ad, 5)}px) rotateY(${-sign * 28}deg)`;
      card.style.opacity = ad > 4 ? 0 : 1 - ad * 0.16; card.style.filter = `brightness(${1 - ad * 0.12})`;
      card.style.zIndex = 9 - ad;
      if (pinned !== null && d < 0) card.style.opacity = 0;   // the A card already occupies the left
    });
    thumbs.forEach((t, i) => { t.classList.toggle('cur', i === cur); t.classList.toggle('pin', i === pinned); });
    thumbs[cur].scrollIntoView({ inline: 'nearest', block: 'nearest' });
    $('pos').textContent = `${cur + 1} / ${N} · ${short(commits[cur].sha)} · ${rel(commits[cur].date)}` + (pinned !== null && pinned !== cur ? ` · A ${short(commits[pinned].sha)} → B ${short(commits[cur].sha)}: +${stats(pinned, cur).add} −${stats(pinned, cur).del}` : '');
    $('navl').disabled = cur === 0; $('navr').disabled = cur === N - 1;
    cards.forEach(c => c.querySelector('.pin').textContent = +c.dataset.i === pinned ? 'Unpin' : 'Pin as A');
  }
  function go(i) {
    i = Math.max(0, Math.min(N - 1, i)); if (i === cur) return;
    const prev = cur; cur = i;
    renderFront(prev); layout();
  }
  // The front card shows its own version, or the diff from A when a card is pinned.
  function renderFront(prev) {
    const pane = cards[cur].querySelector('.code-pane');
    if (pinned !== null && pinned !== cur) { FH.renderUnified(pane, pinned, cur); FH.scrollToChange(pane); return; }
    if (pane.dataset.version !== String(cur)) { FH.morph(pane, cur, { instant: true }); }
    // Flash what this commit changed, so a flip reads as "here is what happened".
    if (prev !== undefined && cur > 0) {
      const changed = new Set(diff(cur - 1, cur).filter(o => o.t === 'add').map(o => o.b));
      Array.from(pane.children).forEach((r, k) => { if (changed.has(k)) { r.classList.add('hl-add'); setTimeout(() => r.classList.remove('hl-add'), 1100); } });
      FH.scrollToChange(pane);
    }
    if (prev !== undefined) { const pp = cards[prev].querySelector('.code-pane'); if (pp.dataset.version !== String(prev)) FH.morph(pp, prev, { instant: true }); }
  }
  function togglePin(i) {
    if (pinned === i) { pinned = null; } else { pinned = i; if (i === cur) cur = Math.min(N - 1, i + 1) === i ? i - 1 : i + 1; }
    cards.forEach((c, k) => { const p = c.querySelector('.code-pane'); if (p.dataset.version !== String(k)) FH.morph(p, k, { instant: true }); });
    renderFront(); layout();
  }
  $('navl').onclick = () => go(cur - 1); $('navr').onclick = () => go(cur + 1);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') go(cur - 1); if (e.key === 'ArrowRight') go(cur + 1);
    if (e.key === 'Home') go(0); if (e.key === 'End') go(N - 1);
    if (e.key === 'p') togglePin(cur); if (e.key === 'c') FH.checkoutMenu(null, cur);
  });
  layout();
})();
</script>
