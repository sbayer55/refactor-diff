[project]
name = "refactor-diff"
version = "0.1.0"
description = "Review refactor-heavy diffs and PRs by collapsing repeated mechanical edits (Python, TypeScript, JavaScript)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Steven Bayer" }]
dependencies = [
    "jedi>=0.19",
    "starlette>=0.37",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn>=0.29",
]

[project.scripts]
refactor-diff = "refactor_diff.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "ruff>=0.5",
]
desktop = [
    "pyinstaller>=6.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refactor_diff"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
