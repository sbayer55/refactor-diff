<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>refactor-diff</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="cmd" id="topbar">
    <button type="button" class="pane-toggle" id="toggle-explorer" data-pane="explorer" aria-pressed="true" title="Hide the explorer (\)">
      <svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="0.75" y="0.75" width="14.5" height="12.5" rx="2"/><path d="M5.5 0.75v12.5"/></svg>
    </button>
    <div class="brand">
      <span class="mark" aria-hidden="true">⇄</span>
      <span class="name">refactor-diff</span>
      <span class="repo" id="repo"></span>
      <a class="chip ai-chip" id="ai-chip" href="#" title="AI provider · open settings"></a>
    </div>
    <form id="source-form" class="source-form" autocomplete="off">
      <div class="cmdline">
        <div class="segmented" role="tablist" aria-label="Diff source">
          <button type="button" role="tab" data-mode="refs" aria-selected="true">branches</button>
          <button type="button" role="tab" data-mode="pr" aria-selected="false">pr</button>
          <button type="button" role="tab" data-mode="worktree" aria-selected="false">worktree</button>
        </div>
        <label class="field" data-show="refs worktree">
          <span>base</span>
          <input name="base" list="branch-list" placeholder="main" required>
        </label>
        <label class="field" data-show="refs">
          <span>head</span>
          <input name="head" list="branch-list" placeholder="HEAD">
        </label>
        <label class="field wide" data-show="pr">
          <span>pr</span>
          <input name="pr" list="pr-list" placeholder="number" inputmode="numeric">
        </label>
      </div>
      <label class="field narrow" title="A pattern must repeat this many times to be collapsed">
        <span>min repeats</span>
        <input name="min_count" type="number" min="1" value="2">
      </label>
      <button type="submit" class="primary" id="analyze-btn">Analyze</button>
      <datalist id="branch-list"></datalist>
      <datalist id="pr-list"></datalist>
    </form>
    <button type="button" class="kbd-btn" id="help-btn" title="Keyboard shortcuts (?)"><kbd>?</kbd></button>
    <button type="button" class="pane-toggle" id="toggle-inspector" data-pane="inspector" aria-pressed="true" title="Hide the inspector (|)">
      <svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="0.75" y="0.75" width="14.5" height="12.5" rx="2"/><path d="M10.5 0.75v12.5"/></svg>
    </button>
  </header>

  <div class="body">
    <aside id="explorer" class="explorer" aria-label="Explorer">
      <div class="tabs" id="explorer-tabs" role="tablist">
        <button type="button" role="tab" data-tab="files" aria-selected="true">Files</button>
        <button type="button" role="tab" data-tab="patterns" aria-selected="false">Patterns</button>
        <button type="button" role="tab" data-tab="warnings" aria-selected="false">Warnings</button>
      </div>
      <div id="explorer-list" class="tree"></div>
      <div id="explorer-foot" class="foot" hidden></div>
    </aside>

    <main class="stream">
      <div id="toolbar" class="toolbar" hidden></div>
      <div id="content" class="content">
        <div class="empty">
          <h2>Pick something to compare</h2>
          <p>Choose two branches, a pull request, or your uncommitted changes, then hit
            <strong>Analyze</strong>. Repeated mechanical edits (renames, type changes,
            identical substitutions) get collapsed into patterns so you only read what's left.</p>
        </div>
      </div>
    </main>

    <aside id="inspector" class="inspector" aria-label="Inspector"></aside>
  </div>

  <footer id="status" class="status" hidden></footer>

  <aside id="nav-panel" class="nav-panel" aria-label="Navigation results" hidden></aside>
  <dialog id="help" class="help" aria-label="Keyboard shortcuts"></dialog>
  <dialog id="palette" class="help palette" aria-label="Command palette">
    <div class="search">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></svg>
      <input id="palette-input" type="text" spellcheck="false" autocomplete="off" autofocus
        placeholder="Type a command…" aria-label="Command" role="combobox" aria-controls="palette-list" aria-expanded="true">
    </div>
    <div id="palette-list" class="palette-list" role="listbox"></div>
  </dialog>
  <dialog id="modal" class="help modal"></dialog>
  <dialog id="settings" class="help modal settings" aria-label="Assistant settings"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/static/syntax.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
