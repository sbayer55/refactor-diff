<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Refactor Diff</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --fg: #1b1f24; --muted: #6b7280; --border: #d9dee5;
    --card: #ffffff; --accent: #2563eb; --accent-fg: #ffffff; --danger: #b91c1c; --danger-bg: #fef2f2;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181d; --fg: #e6e8eb; --muted: #9aa3ad; --border: #2c323a;
      --card: #1d2127; --accent: #3b82f6; --danger: #f87171; --danger-bg: #2a1a1a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); display: grid; place-items: center; -webkit-user-select: none; user-select: none; }
  main { width: min(560px, calc(100vw - 48px)); }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 20px; }
  button.primary {
    font: inherit; font-weight: 600; color: var(--accent-fg); background: var(--accent);
    border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  kbd { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); margin-left: 8px; }
  section { margin-top: 28px; }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 8px; }
  ul.recents { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--card); overflow: hidden; }
  ul.recents:empty { display: none; }
  ul.recents li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--border); cursor: pointer; }
  ul.recents li:first-child { border-top: 0; }
  ul.recents li:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  ul.recents .name { font-weight: 600; white-space: nowrap; }
  ul.recents .path { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; flex: 1; }
  ul.recents .remove { visibility: hidden; border: 0; background: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 0 4px; }
  ul.recents li:hover .remove { visibility: visible; }
  .empty { color: var(--muted); font-size: 13px; }
  .error { display: none; margin-top: 20px; padding: 12px 14px; border-radius: 10px; background: var(--danger-bg); color: var(--danger); -webkit-user-select: text; user-select: text; }
  .error.show { display: block; }
  .error pre { margin: 8px 0 0; white-space: pre-wrap; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 160px; overflow: auto; }
  .status { display: none; color: var(--muted); margin-top: 20px; }
  .status.show { display: block; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; display: flex; gap: 12px; align-items: baseline; }
  footer .spacer { flex: 1; }
  a.link, button.link { white-space: nowrap; font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; }
  a.link:hover, button.link:hover { text-decoration: underline; }
  ul.tools { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
  ul.tools li { padding: 10px 12px; border-top: 1px solid var(--border); }
  ul.tools li:first-child { border-top: 0; }
  ul.tools .what { display: flex; gap: 8px; align-items: baseline; }
  ul.tools .name { font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  ul.tools .problem { color: var(--danger); }
  ul.tools .purpose { color: var(--muted); font-size: 12px; margin-left: auto; }
  ul.tools .fix { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  ul.tools code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; -webkit-user-select: all; user-select: all; }
  .tools-ok { color: var(--muted); font-size: 12px; }
  .tools-head { display: flex; align-items: baseline; }
  .tools-head .spacer { flex: 1; }
</style>
</head>
<body>
<main>
  <h1>Refactor Diff</h1>
  <p class="lead">Review a refactor-heavy diff or pull request with the repeated edits collapsed.</p>

  <button class="primary" id="open">Open Repository…<kbd>⌘O</kbd></button>

  <div class="status" id="status"></div>
  <div class="error" id="error"><div id="error-title"></div><pre id="error-detail"></pre></div>

  <section>
    <h2>Recent</h2>
    <ul class="recents" id="recents"></ul>
    <p class="empty" id="no-recents">Repositories you open will be listed here. You can also drop a folder on the Dock icon.</p>
  </section>

  <section id="requirements" hidden>
    <div class="tools-head"><h2>Requirements</h2><span class="spacer"></span><button class="link" id="recheck">Check Again</button></div>
    <ul class="tools" id="tools"></ul>
  </section>

  <footer>
    <span id="tools-ok" class="tools-ok"></span>
    <span class="spacer"></span>
    <button class="link" id="settings">Settings…<kbd>⌘,</kbd></button>
  </footer>
</main>

<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const basename = (p) => p.replace(/\/+$/, "").split("/").pop() || p;

  function showError(title, detail) {
    $("error-title").textContent = title;
    $("error-detail").textContent = detail || "";
    $("error").classList.add("show");
    setBusy(false);
  }
  function clearError() { $("error").classList.remove("show"); }

  let gitMissing = false;

  function setBusy(busy, message) {
    $("open").disabled = busy || gitMissing;
    $("status").textContent = message || "";
    $("status").classList.toggle("show", busy);
  }

  async function renderRecents() {
    const recents = await invoke("list_recents");
    const ul = $("recents");
    ul.innerHTML = recents.map((p) =>
      `<li data-path="${esc(p)}"><span class="name">${esc(basename(p))}</span><span class="path">${esc(p)}</span>` +
      `<button class="remove" title="Remove from recents" aria-label="Remove">×</button></li>`).join("");
    $("no-recents").style.display = recents.length ? "none" : "";
  }

  async function openRepo(path) {
    clearError();
    setBusy(true, `Starting ${basename(path)}…`);
    try {
      await invoke("open_repo", { path });
      // On success the window navigates to the review UI; nothing more to do here.
    } catch (e) {
      showError(`Couldn't open ${path}`, String(e));
      renderRecents();
    }
  }

  async function pickAndOpen() {
    const path = await invoke("pick_repo");
    if (path) await openRepo(path);
  }

  $("open").addEventListener("click", pickAndOpen);
  $("recents").addEventListener("click", async (ev) => {
    const li = ev.target.closest("li");
    if (!li) return;
    if (ev.target.closest(".remove")) {
      await invoke("remove_recent", { path: li.dataset.path });
      renderRecents();
    } else {
      openRepo(li.dataset.path);
    }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") clearError();
  });

  // The sidecar died while the review UI was showing; the app brought us back here.
  listen("sidecar-exited", (ev) => {
    const { title, detail } = ev.payload || {};
    showError(title || "The backend stopped unexpectedly.", detail);
  });

  // Command-line tools the backend needs: one quiet line when all is well, otherwise each
  // problem with the command that fixes it.
  async function renderTools(refresh = false) {
    $("recheck").disabled = true;
    let tools = [];
    try { tools = await invoke("preflight", { refresh }); } catch (e) { console.warn(e); }
    $("recheck").disabled = false;
    const bad = tools.filter((t) => t.problem);
    $("requirements").hidden = !bad.length;
    $("tools-ok").textContent = bad.length ? "" : tools.map((t) => t.version || t.name).join(" · ");
    $("tools").innerHTML = bad.map((t) =>
      `<li><div class="what"><span class="name">${esc(t.name)}</span><span class="problem">${esc(t.problem)}</span>` +
      `<span class="purpose">${t.required ? "required" : `for ${esc(t.purpose)}`}</span></div>` +
      `<div class="fix"><code>${esc(t.fix)}</code><button class="link" data-copy="${esc(t.fix)}">Copy</button></div></li>`).join("");
    gitMissing = bad.some((t) => t.required);
    $("open").disabled = gitMissing || $("status").classList.contains("show");
    $("open").title = gitMissing ? "git is required; see Requirements below" : "";
  }

  $("recheck").addEventListener("click", () => renderTools(true));
  $("tools").addEventListener("click", async (ev) => {
    const btn = ev.target.closest("[data-copy]");
    if (!btn) return;
    try { await navigator.clipboard.writeText(btn.dataset.copy); btn.textContent = "Copied"; }
    catch { btn.textContent = "Select and copy"; }
  });
  $("settings").addEventListener("click", () => invoke("open_settings"));

  (async () => {
    renderTools();
    await renderRecents();
    const status = await invoke("get_status");
    if (status.lastError) showError(status.lastError.title, status.lastError.detail);
    if (location.hash === "#loading" && status.repo) setBusy(true, `Starting ${basename(status.repo)}…`);
  })();
</script>
</body>
</html>
