[package]
name = "refactor-diff-desktop"
version = "0.1.0"
description = "Review refactor-heavy diffs and PRs by collapsing repeated mechanical edits."
authors = ["Steven Bayer"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "refactor_diff_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
libc = "0.2"
log = "0.4"
env_logger = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
