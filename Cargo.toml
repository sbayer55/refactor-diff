[workspace]
resolver = "3"
members = [
    "crates/refactor-diff-core",
    "crates/refactor-diff-server",
    "crates/refactor-diff",
    "desktop/src-tauri",
]
# `cargo test` / `cargo clippy` at the root cover the portable crates; the desktop crate
# needs Tauri's system libraries and is built explicitly (`just desktop-*`).
default-members = [
    "crates/refactor-diff-core",
    "crates/refactor-diff-server",
    "crates/refactor-diff",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Steven Bayer"]
license = "MIT"
repository = "https://github.com/sbayer55/refactor-diff"
description = "Review refactor-heavy diffs and PRs by collapsing repeated mechanical edits."

[workspace.dependencies]
# internal
refactor-diff-core = { path = "crates/refactor-diff-core" }
refactor-diff-server = { path = "crates/refactor-diff-server" }

# shared
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
directories = "6"
eventsource-stream = "0.2"
flate2 = "1"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
lru = "0.16"
mime_guess = "2"
open = "5"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
unicode-general-category = "1"
url = "2"
which = "8"

# test
assert_cmd = "2"
predicates = "3"
pretty_assertions = "1"
wiremock = "0.6"

# desktop
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
# The engine (sequence matching, tokenizing, move detection) is CPU-bound.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# A panic inside one analysis request must become a 500, not take the server
# (and the desktop window) down.
panic = "unwind"

# Keep `cargo test` fast: optimize dependencies (tree-sitter grammars, regex, serde) even in
# dev, while our own crates stay unoptimized and debuggable.
[profile.dev.package."*"]
opt-level = 2
